<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Copy LaTeX Customization</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3>LaTeX or Typst?</h3>
  <div class="toggle-container">
    <span class="format-label">LaTeX</span>
    <label class="toggle-switch">
      <input type="checkbox" id="formatToggle">
      <span class="slider"></span>
    </label>
    <span class="format-label">Typst</span>
  </div>
  <div class="config-container">
    <button id="configBtn" title="Settings" class="icon-btn" aria-label="Settings">
      <!-- Catppuccin Icon. Source: https://allsvgicons.com/pack/catppuccin/#config -->
      <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 16 16" stroke="var(--icon-stroke)"><path fill="none" stroke="var(--icon-stroke)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.711" d="M7.997 9.694a1.726 1.695 0 1 0 0-3.39a1.726 1.695 0 0 0 0 3.39m3.021-6.78l3.021 5.085l-3.021 5.085H4.976L1.955 7.999l3.021-5.085z"/></svg>
    </button>
    <div id="settingsPanel" class="settings-panel" style="display:none;">
      <label class="settings-checkbox">
        <input type="checkbox" id="showOverlayOption">
        Show overlay on hover
      </label>
      <label class="settings-checkbox">
        <input type="checkbox" id="contextMenuOption">
        Show copy selection option
      </label>
      <label class="settings-checkbox">
        <input type="checkbox" id="overrideSelectionCopyOption">
        Ctrl+C to copy selection
      </label>
      <div class="theme-radio-group">
        <label class="theme-radio">
          <input type="radio" name="themeMode" value="light">
          Light
        </label>
        <label class="theme-radio">
          <input type="radio" name="themeMode" value="dark">
          Dark
        </label>
        <label class="theme-radio">
          <input type="radio" name="themeMode" value="system">
          System
        </label>
      </div>
      <div class="useful-links">
        <span></span> <!-- Useful links -->
        <a class="icon-btn icon-link" href="https://github.com/Mapaor/copy-latex-firefox-extension" target="_blank" rel="noopener noreferrer" title="Source code" aria-label="Source code">
          <svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <g data-name="Layer 2">
              <rect width="24" height="24" opacity="0"/>
                <path d="M16.24 22a1 1 0 0 1-1-1v-2.6a2.15 2.15 0 0 0-.54-1.66 1 1 0 0 1 .61-1.67C17.75 14.78 20 14 20 9.77a4 4 0 0 0-.67-2.22 2.75 2.75 0 0 1-.41-2.06 3.71 3.71 0 0 0 0-1.41 7.65 7.65 0 0 0-2.09 1.09 1 1 0 0 1-.84.15 10.15 10.15 0 0 0-5.52 0 1 1 0 0 1-.84-.15 7.4 7.4 0 0 0-2.11-1.09 3.52 3.52 0 0 0 0 1.41 2.84 2.84 0 0 1-.43 2.08 4.07 4.07 0 0 0-.67 2.23c0 3.89 1.88 4.93 4.7 5.29a1 1 0 0 1 .82.66 1 1 0 0 1-.21 1 2.06 2.06 0 0 0-.55 1.56V21a1 1 0 0 1-2 0v-.57a6 6 0 0 1-5.27-2.09 3.9 3.9 0 0 0-1.16-.88 1 1 0 1 1 .5-1.94 4.93 4.93 0 0 1 2 1.36c1 1 2 1.88 3.9 1.52a3.89 3.89 0 0 1 .23-1.58c-2.06-.52-5-2-5-7a6 6 0 0 1 1-3.33.85.85 0 0 0 .13-.62 5.69 5.69 0 0 1 .33-3.21 1 1 0 0 1 .63-.57c.34-.1 1.56-.3 3.87 1.2a12.16 12.16 0 0 1 5.69 0c2.31-1.5 3.53-1.31 3.86-1.2a1 1 0 0 1 .63.57 5.71 5.71 0 0 1 .33 3.22.75.75 0 0 0 .11.57 6 6 0 0 1 1 3.34c0 5.07-2.92 6.54-5 7a4.28 4.28 0 0 1 .22 1.67V21a1 1 0 0 1-.94 1z"/>
            </g>
          </svg>
        </a>
        <a class="icon-btn icon-link" href="https://mapaor.github.io/copy-latex-website" target="_blank" rel="noopener noreferrer" title="Website" aria-label="Website">
          <svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12s4.477 10 10 10"/><path stroke-linecap="round" stroke-linejoin="round" d="M13 2.05S16 6 16 12m-5 9.95S8 18 8 12s3-9.95 3-9.95M2.63 15.5H12m-9.37-7h18.74"/><path d="M21.879 17.917c.494.304.463 1.043-.045 1.101l-2.567.291l-1.151 2.312c-.228.459-.933.234-1.05-.334l-1.255-6.116c-.099-.48.333-.782.75-.525z" clip-rule="evenodd"/></g>
          </svg>
        </a>
      </div>
    </div>
  </div>
  <script src="lib/polyfill/browser-polyfill.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
